<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — MoveWell</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">◒</div>
      <div class="auth-title" id="formTitle">Welcome back</div>
      <div class="auth-subtitle" id="formSubtitle">Sign in to start your MoveWell routine</div>

      <div class="form-error" id="formError"></div>

      <form id="authForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%" id="submitBtn">Sign in</button>
      </form>

      <div class="form-toggle">
        <span id="toggleLabel">Don't have an account?</span>
        <button type="button" id="toggleModeBtn">Create one</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
