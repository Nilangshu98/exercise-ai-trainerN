services:
  - type: web
    name: exercise-ai-trainer-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: exercise-ai-trainer-ml
          property: host
      - key: ML_SERVICE_KEY
        sync: false
      - key: FRONTEND_URLS
        sync: false
    disk:
      name: exercise-data
      mountPath: /opt/render/project/src/db
      sizeGB: 1

  - type: web
    name: exercise-ai-trainer-ml
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_DATA_DIR
        value: /var/data
      - key: ML_SERVICE_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: exercise-ml-data
      mountPath: /var/data
      sizeGB: 1