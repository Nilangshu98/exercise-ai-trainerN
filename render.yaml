services:
  - type: web
    name: exercise-ai-trainer-ml
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_DATA_DIR
        value: /var/data
      - key: ML_SERVICE_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    disk:
      name: exercise-ml-data
      mountPath: /var/data
      sizeGB: 1
